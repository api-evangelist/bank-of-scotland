apis:
- aid: bank-of-scotland:bank-of-scotland-open-data-api
  name: Bank of Scotland Open Data API
  description: >-
    PUBLIC, unauthenticated OBIE Open Data reference API for Bank of Scotland,
    exposing ATM locations, branch details, personal and business current
    account products, unsecured SME loans, and commercial credit card products.
    Confirmed live at https://api.bankofscotland.co.uk/open-banking/v2.2 (all
    six resource endpoints return HTTP 200 with Open-Licence JSON).
  humanURL: https://developer.lloydsbanking.com/open-data
  baseURL: https://api.bankofscotland.co.uk/open-banking/v2.2
  tags:
  - Open Data
  - ATMs
  - Branches
  - Product
  tags_raw:
  - Open Data
  - ATMs
  - Branches
  - Products
  properties:
