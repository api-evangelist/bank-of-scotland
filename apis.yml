    name: Initiate a Bank of Scotland domestic payment (PIS)
    url: skills/bank-of-scotland-initiate-domestic-payment.md
  - type: Documentation
    url: https://developer.lloydsbanking.com/
  - type: APIReference
    url: https://github.com/OpenBankingUK/read-write-api-specs
- aid: bank-of-scotland:bank-of-scotland-confirmation-of-funds-api
  name: Bank of Scotland Confirmation of Funds API (CBPII)
  description: >-
    OBIE Read/Write Confirmation of Funds (CBPII) API - card-based payment
    instrument issuers confirm whether funds are available on an account.
    FAPI-secured (OAuth2/OIDC, mTLS, PSD2 SCA); requires developer onboarding
    and eIDAS/OBIE certificates. Spec below is the shared OBIE Read/Write
    standard, not a bank-proprietary contract.
