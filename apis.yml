- aid: bank-of-scotland:bank-of-scotland-account-information-api
  name: Bank of Scotland Account and Transaction Information API (AIS)
  description: >-
    OBIE Read/Write Account and Transaction Information (AIS) API - account
    details, balances, transactions, standing orders, direct debits,
    beneficiaries, statements, and products. FAPI-secured (OAuth2/OIDC, mTLS,
    PSD2 SCA); requires developer onboarding and eIDAS/OBIE certificates. Spec
    below is the shared OBIE Read/Write standard, not a bank-proprietary
    contract.
  humanURL: https://developer.lloydsbanking.com/
  tags:
  - Account Information
  - AIS
  - Read/Write
  properties:
  - type: OpenAPI
    url: openapi/obie-account-info-openapi.yaml
  - type: Overlay
    url: overlays/bank-of-scotland-account-info-overlay.yaml
  - type: AgentSkill
    name: Read Bank of Scotland account transactions (AIS)
    url: skills/bank-of-scotland-read-account-transactions.md
  - type: Documentation
    url: https://developer.lloydsbanking.com/
  - type: APIReference
    url: https://github.com/OpenBankingUK/read-write-api-specs
- aid: bank-of-scotland:bank-of-scotland-payment-initiation-api
  name: Bank of Scotland Payment Initiation API (PIS)
  description: >-
    OBIE Read/Write Payment Initiation (PIS) API - domestic, scheduled, standing
    order, international, and file payment consents and orders. FAPI-secured
    (OAuth2/OIDC, mTLS, PSD2 SCA); requires developer onboarding and eIDAS/OBIE
    certificates. Spec below is the shared OBIE Read/Write standard, not a
    bank-proprietary contract.
  humanURL: https://developer.lloydsbanking.com/
  tags:
  - Payment Initiation
  - PIS
  - Read/Write
  properties:
  - type: OpenAPI
    url: openapi/obie-payment-initiation-openapi.yaml
  - type: Overlay
