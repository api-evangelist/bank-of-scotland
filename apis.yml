name: Bank of Scotland
kind: company
description: >-
  Bank of Scotland is a UK high-street retail and commercial bank, founded in
  1695 and headquartered in Edinburgh, and is one of the oldest banks in the
  United Kingdom. It is a wholly owned subsidiary brand of Lloyds Banking Group
  (alongside Lloyds Bank and Halifax), authorised by the Prudential Regulation
  Authority and regulated by the Financial Conduct Authority and the PRA. As one
  of the nine mandated CMA9 account-providers, Bank of Scotland participates in
  the UK Open Banking regime under PSD2, publishing PUBLIC, unauthenticated Open
  Data reference APIs (ATMs, branches, personal and business current accounts,
  unsecured SME loans, and commercial credit cards) conformant to the Open
  Banking Implementation Entity (OBIE) Open Data Standard, plus the OBIE
  Read/Write API family - Account and Transaction Information (AIS), Payment
  Initiation (PIS), and Confirmation of Funds (CBPII) - secured with FAPI-grade
  OAuth2/OIDC, mutual-TLS client authentication, and PSD2 strong customer
  authentication, accessed through the Lloyds Banking Group developer platform
  after eIDAS/OBIE certificate onboarding.
